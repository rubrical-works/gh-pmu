name: Gosec

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 01:00 UTC
    - cron: '0 1 * * 0'

permissions:
  contents: read
  security-events: write

# Cancel superseded runs on the same ref. Scoped to pull_request events only:
# a push to main or a tag build must run to completion, since ci.yml's release
# job publishes from it and a cancelled release is worse than a duplicated one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gosec:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gosec
        uses: securego/gosec@master
        with:
          # G304 excluded: CLI tool reads user-supplied file paths by design
          # G204 excluded: remaining calls are git subprocess with hardcoded binary name
          args: '-no-fail -exclude=G304,G204 -fmt sarif -out gosec-results.sarif ./...'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec-results.sarif
