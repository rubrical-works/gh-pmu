name: CI

on:
  push:
    # Feature branches run CI on push so failures surface while the work is in
    # progress. Without this, /work commits per AC and /done pushes the batch,
    # so the first CI signal arrives at merge time with every commit at once.
    branches: [main, 'pmu/**']
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: write

# Cancel superseded runs on the same ref. Scoped to pull_request events only:
# a push to main or a tag build must run to completion, since ci.yml's release
# job publishes from it and a cancelled release is worse than a duplicated one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Test and Lint run in parallel
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -short -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Verify config not corrupted by tests
        run: node .claude/scripts/open-release/verify-config.js

      - name: Upload coverage reports to Codecov
        if: matrix.go-version == '1.23'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Generate coverage report
        run: go tool cover -func=coverage.out

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${COVERAGE}%"
          THRESHOLD=15
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -s -l .
            exit 1
          fi

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      # Compile-check tag-gated tests WITHOUT running them. Integration/e2e
      # tests make live GitHub API calls and must never run in CI (caused an
      # account lockout, 2025-12-08 — see #876). `go vet` only type-checks and
      # compiles; it makes zero API calls, so this catches tag-gated rot
      # (e.g. signature drift) that plain `go test -short` never compiles.
      - name: Compile-check tag-gated tests (no API calls)
        run: go vet -tags "integration e2e" ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # Build waits for Test and Lint to pass
  build:
    needs: [test, lint]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.23']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Build binary
        run: go build -o gh-pmu .

      - name: Verify binary
        run: ./gh-pmu --version || true

  # Release waits for Build to pass (only on tags)
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
